<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Atlas Case Studies Graph</title>
        
        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6"
            crossorigin="anonymous"
        />
        
        <!-- Custom CSS -->
        <link rel="stylesheet" href="styles.css" type="text/css" />
    </head>

    <body>
        <div class="card card-full-width">
            <div id="mynetwork" class="card-body"></div>
        </div>

        <!-- Bootstrap JS -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-JEW9xMcG8R+pH31jmWH6WWP0WintQrMb4s7ZOdauHnUtxwoG2vI5DkLtS3qm9Ekf"
            crossorigin="anonymous"
        ></script>

        <!-- vis-network library -->
        <script type="text/javascript" src="https://unpkg.com/vis-network@latest/standalone/umd/vis-network.min.js"></script>

        <!-- Graph data (loaded as a script so this page also works opened directly as a file, -->
        <!-- since browsers block fetch() of local files) -->
        <script type="text/javascript" src="data/atlas-data.js"></script>

        <!-- Graph modules -->
        <script type="text/javascript" src="js/graph-config.js"></script>
        <script type="text/javascript" src="js/graph-highlighting.js"></script>
        <script type="text/javascript" src="js/graph-filtering.js"></script>
        <script type="text/javascript" src="js/graph-popup.js"></script>
        <script type="text/javascript" src="js/graph-core.js"></script>

        <!-- Initialize graph -->
        <script type="text/javascript">
            // Initialize graph when page loads
            document.addEventListener('DOMContentLoaded', function() {
                window.GraphCore.init('mynetwork', window.__GRAPH_DATA__)
                    .catch(function(error) {
                        console.error('Failed to initialize graph:', error);
                    });
            });
        </script>
    </body>
</html>
