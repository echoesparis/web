<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns:svg="http://www.w3.org/2000/svg" xmlns="http://www.w3.org/2000/svg" version="1.2" width="1050" height="590" viewBox="0 0 1050 590">
  <style>
    /* <![CDATA[ */
    .rotating-group {
      transform-origin: center;
      animation: rotate 10s linear infinite;
    }
    
    .barrel-group {
      transform: scale(1, 0.8); /* Creates slight barrel effect */
    }
    
    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
    /* ]]> */
  </style>

  <!-- Add a clip path for barrel distortion -->
  <defs>
    <clipPath id="barrel-clip">
      <path d="M 50,45 
               Q 525,0 1000,45 
               L 1000,545 
               Q 525,590 50,545 
               Z"/>
    </clipPath>
  </defs>

  <g class="rotating-group" clip-path="url(#barrel-clip)">
    <g class="barrel-group">
      <!-- Metals (red) stripes -->
      <path d="m 120,545 h 20 V 45 H 120 V 545 z" style="fill:#E4152B"/>
      <path d="m 160,545 h 20 V 45 H 160 V 545 z" style="fill:#E4152B"/>
      <path d="m 200,545 h 20 V 45 H 200 V 545 z" style="fill:#E4152B"/>
      
      <!-- Natural (green) stripes -->
      <path d="m 240,545 h 20 V 45 H 240 V 545 z" style="fill:#008161"/>
      <path d="m 280,545 h 20 V 45 H 280 V 545 z" style="fill:#008161"/>
      <path d="m 320,545 h 20 V 45 H 320 V 545 z" style="fill:#008161"/>
      
      <!-- Minerals (grey) stripes -->
      <path d="m 360,545 h 20 V 45 H 360 V 545 z" style="fill:#757474"/>
      <path d="m 400,545 h 20 V 45 H 400 V 545 z" style="fill:#757474"/>
      <path d="m 440,545 h 20 V 45 H 440 V 545 z" style="fill:#757474"/>
      
      <!-- Plastics (pink) stripes -->
      <path d="m 480,545 h 20 V 45 H 480 V 545 z" style="fill:#ED73AA"/>
      <path d="m 520,545 h 20 V 45 H 520 V 545 z" style="fill:#ED73AA"/>
      <path d="m 560,545 h 20 V 45 H 560 V 545 z" style="fill:#ED73AA"/>
      
      <!-- Glass (blue with opacity) stripes -->
      <path d="m 600,545 h 20 V 45 H 600 V 545 z" style="fill:#0097C4;fill-opacity:0.3"/>
      <path d="m 640,545 h 20 V 45 H 640 V 545 z" style="fill:#0097C4;fill-opacity:0.3"/>
      <path d="m 680,545 h 20 V 45 H 680 V 545 z" style="fill:#0097C4;fill-opacity:0.3"/>

      <!-- Repeat pattern to complete the circle -->
      <path d="m 720,545 h 20 V 45 H 720 V 545 z" style="fill:#E4152B"/>
      <path d="m 760,545 h 20 V 45 H 760 V 545 z" style="fill:#008161"/>
      <path d="m 800,545 h 20 V 45 H 800 V 545 z" style="fill:#757474"/>
      <path d="m 840,545 h 20 V 45 H 840 V 545 z" style="fill:#ED73AA"/>
      <path d="m 880,545 h 20 V 45 H 880 V 545 z" style="fill:#0097C4;fill-opacity:0.3"/>
    </g>
  </g>
</svg>